minimum_pre_commit_version: 4.6.1
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: repository-policy
        name: repository policy, links, and secret hygiene
        entry: python scripts/repository_checks.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check backend scripts
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: python -m ruff format --check backend scripts
        language: system
        pass_filenames: false
